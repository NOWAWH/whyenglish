grammar:{label:"Advanced grammar",items:[
["Negative inversion","structure","After negative/restrictive adverbials at the start (never, rarely, hardly, no sooner, not only, under no circumstances), the auxiliary comes before the subject.","Never have I seen such a mess. / Not only did he lie, but he also cheated."],
["Inverted conditionals","structure","Drop ‘if’ and invert: Should (open), Were (unreal), Had (past unreal). More formal.","Had I known, I would have called. / Should you need help, ask me. / Were she here, she’d agree."],
["Mixed conditionals","structure","Past condition with present result: if + past perfect, would + base. Present condition with past result: if + past simple, would have + past participle.","If I had studied medicine, I would be a doctor now. / If he weren’t so lazy, he would have passed."],
["Cleft sentences","structure","Emphasise one part with It is/was … that/who or What … is/was.","It was Maria who solved it. / What I need is a long holiday. / The reason why he left is unclear."],
["Subjunctive","structure","Base form after verbs/adjectives of demand, suggestion, importance (insist, demand, recommend, essential, vital).","The manager insisted that he be present. / It is vital that she arrive early."],
["Wish / If only","structure","Present regret: wish + past simple. Past regret: wish + past perfect. Annoyance/change: wish + would.","I wish I knew the answer. / If only I had listened. / I wish you would stop interrupting."],
["Impersonal passive reporting","structure","It is said/believed/thought that … or subject + is said to + infinitive (perfect infinitive for earlier events).","He is said to be a genius. / The company is believed to have lost millions."],
["Participle clauses","structure","Shorten clauses with -ing (active, same time), -ed (passive) or having + pp (earlier action).","Having finished the report, she left. / Built in 1890, the bridge is still in use."],
["Causative have/get","structure","have/get + object + past participle for services done by someone else; have + object + base = instruct.","I had my car repaired. / She got her hair cut. / He had the staff work late."],
["Future perfect (continuous)","tense","Future perfect: will have + pp (done before a time). Continuous: will have been + -ing (duration up to a time).","By June I will have finished the course. / By then she will have been working here for ten years."],
["Emphatic do","structure","Do/does/did + base verb adds emphasis or contrast.","I do appreciate your help. / He did warn us."],
["Inversion with so/such","structure","So + adjective + auxiliary + subject, or Such + be + noun, to emphasise degree.","So tired was she that she fell asleep. / Such was his anger that he left."],
["Ellipsis and substitution","structure","Avoid repetition with so, not, do so, one/ones, or by omitting words.","‘Will it rain?’ ‘I hope not.’ / He asked me to leave, and I did so."],
["Modals of deduction (past)","modal","must/can’t/may/might + have + pp to speculate about the past with different certainty.","She must have forgotten. / He can’t have seen us. / They might have left early."],
["Advanced linkers","linker","Contrast: nevertheless, whereas, albeit. Result: consequently, hence. Concession: much as, however hard.","Albeit expensive, it was worth it. / Much as I admire her, I disagree."],
["Nominalisation","style","Turn verbs/adjectives into nouns for a formal, academic tone.","The rapid increase in prices caused concern. (instead of: Prices increased rapidly.)"],
["Relative clauses","structure","Defining clauses identify (no commas); non-defining add extra information (commas, no ‘that’). Use preposition + whom/which and whose in formal style.","The woman to whom I spoke was helpful. / My brother, who lives in Rome, is a chef. / The house whose roof collapsed was empty."],
["Gerund vs infinitive","structure","Some verbs change meaning: remember/forget/stop/try/regret/go on + -ing (past or process) vs + to (future or purpose).","I remember locking the door. / Remember to lock the door. / He went on talking for an hour. / She went on to become a doctor."],
["Used to / would / be used to","structure","used to + base = past habit or state; would = past habit only; be/get used to + -ing = accustomed.","I used to live in Paris. / We would play there every day. / I’m used to getting up early."],
["Reporting verbs","structure","Choose the verb pattern: admit/deny/suggest + -ing; promise/refuse/offer + to-infinitive; accuse/blame + object + of/for -ing; insist/claim + that-clause.","She admitted taking the money. / He accused me of lying. / They promised to come."],
["Passive with modals and get","structure","Modal + be + pp (present), modal + have been + pp (past). Get-passive is informal and often shows unexpected events.","The form must be signed. / It should have been done earlier. / He got fired last week."],
["Advanced comparisons","structure","the + comparative … the + comparative; twice/three times as … as; by far the + superlative; not nearly as … as.","The harder you work, the more you earn. / It’s by far the best option. / This is twice as expensive as that."],
["Concession clauses","structure","Although/though/even though, while, whereas, however + adj/adv, adjective + as + subject.","Hard as he tried, he failed. / However tired you are, you must finish."],
["Purpose clauses","structure","so as (not) to / in order (not) to + base; so that / in order that + clause; lest (formal, subjunctive).","She left early so as not to miss the train. / He hid it lest anyone should find it."],
["Unreal present and past","structure","It’s (high) time / would rather / as if / as though + past tense for unreal or hypothetical situations.","It’s time we left. / I’d rather you didn’t smoke. / He talks as if he knew everything."],
["Hedging language","style","Soften claims in academic writing with seem, appear, tend to, may, it could be argued, to some extent.","The results appear to suggest a link. / It could be argued that the policy has failed."],
["Locative inversion","structure","Place or direction expressions at the start of a sentence trigger inversion in literary or descriptive style.","On the table lay a letter. / Here comes the bus. / Out of the room ran the children."],
["Continuous and perfect infinitives","structure","to be + -ing (happening now); to have + pp (earlier action); to have been + -ing (earlier, ongoing).","He seems to be working. / She claims to have met the president. / They appear to have been waiting for hours."]
]},

const save=()=>{try{localStorage.setItem("eng-done",JSON.stringify(done))}catch(e){}};
const k=(s,t)=>s+"|"+t[0];
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function items(){const q=$("q").value.toLowerCase();return D[sec].items.filter(t=>(tag=="All"||t[1]==tag)&&(!unOnly||!done[k(sec,t)])&&(!q||t.join(" ").toLowerCase().includes(q)))}
function render(){
$("tabs").innerHTML=keys.map(s=>`<button class="${s==sec?"on":""}" data-s="${s}">${D[s].label}</button>`).join("");
const tags=["All",...new Set(D[sec].items.map(t=>t[1]))];
$("chips").innerHTML=tags.length>2?tags.map(t=>`<button class="${t==tag?"on":""}" data-t="${t}">${t}</button>`).join(""):"";
const all=D[sec].items,n=all.filter(t=>done[k(sec,t)]).length;
$("bar").style.width=(100*n/all.length)+"%";
$("cnt").textContent=n+" of "+all.length+" learned";
$("hideBtn").className=hide?"on":"";$("unBtn").className=unOnly?"on":"";$("quizBtn").className=quiz?"on":"";
$("hideBtn").textContent=hide?"Show answers":"Hide answers";

$("list").innerHTML=l.length?l.map(t=>{const d=done[k(sec,t)];return `<div class="card ${d?"done":""}"><div class="top"><span class="term">${esc(t[0])}</span><span class="tag">${t[1]}</span></div><div class="ans"><p class="mean">${esc(t[2])}</p><p class="ex">${esc(t[3])}</p></div><button class="lrn" data-k="${esc(k(sec,t))}">${d?"✓ Learned (undo)":"Mark as learned"}</button></div>`}).join(""):'<p class="cnt">Nothing to show.</p>';
}

else if(b.id=="again")nextQ();

render()});

['No sooner … than','rewrite','Inversion with past perfect after ‘No sooner’; ‘Hardly/Scarcely … when’ works the same way.','As soon as she left, it rained. → No sooner had she left than it rained.'],

['although → despite','rewrite','Despite/In spite of + noun/-ing/the fact that + clause.','Although it rained, we went out. → Despite the rain, we went out.'],
